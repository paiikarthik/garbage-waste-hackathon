<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack Signup</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=home,login,nest_eco_leaf" />
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav>
        <div class="nav-con">
       <div class="logo"><img src="images/bucket.png" alt="">EcoTrack</div> 
       <div class="links">
        <div class="link">
            <a href="index.html"> <span class="material-symbols-outlined">home</span>Home</a>
            <a href="signup.html"><span class="material-symbols-outlined">login</span>Signup</a>
        </div>
       </div>
        </div>
    </nav>

  
<section id="sec">

    <div class="sign-container">

        <div class="sign-comp">
             <h2>Login Now <span class="material-symbols-outlined">nest_eco_leaf</span> </h2>
              <form action="" id="loginForm"> 
           

             <label for="email">Enter Your Email</label>
             <input type="email" name="email" id="email" required>


             <label for="pass">Enter Password</label>
             <input type="password" name="pass" id="pass" required>
             <p id="pyar">Forgot password? <a href="" id="forgotPassword"> Click Here</a></p>

           <button>Submit</button>
           <p>or</p>
            
           <button type="button" id="googleSignIn" class="google-btn">
                Login with Google <i class="fa-brands fa-google"></i>
            </button>
             </form> 
              <p>Dont Have an account?<a href="signup.html"> Create it</a></p>
        </div>

    </div>
</section>

<script type="module">
    // Import Firebase functions
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


//Firebase configuration
const firebaseConfig = {
    apiKey: "AIzaSyBl3f2IdW8reYSagNrftzXajeq-CTJHYTY",
    authDomain: "ecotrack-cd381.firebaseapp.com",
    projectId: "ecotrack-cd381",
    storageBucket: "ecotrack-cd381.firebasestorage.app",
    messagingSenderId: "259113016797",
    appId: "1:259113016797:web:f1e681e829f873fff3ea34"
};


// Initialize Firebase
const app = initializeApp(firebaseConfig);


// Initialize Firebase Authentication
const auth = getAuth(app);

// EMAIL + PASSWORD LOGIN
const loginForm = document.getElementById("loginForm");

loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const email = document.getElementById("email").value;
    const password = document.getElementById("pass").value;

    try {
        const apiRes = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });
        const data = await apiRes.json();

        if (!apiRes.ok) {
            alert(data.detail || data.message || "Invalid email or password.");
            return;
        }

        if (data.token) {
            localStorage.setItem("ecotrack_token", data.token);
        }
        
        try {
            await signInWithEmailAndPassword(auth, email, password);
        } catch (e) {
            console.log("Firebase sync note:", e.message);
        }

        alert("Login successful!");
        window.location.href = "index.html";
    } catch (error) {
        console.error(error);
        alert("Login failed: " + error.message);
    }
});




const googleButton = document.getElementById("googleSignIn");

googleButton.addEventListener("click", async () => {
    const provider = new GoogleAuthProvider();
    try {
        let googleEmail = null;
        let googleName = null;

        try {
            const result = await signInWithPopup(auth, provider);
            if (result && result.user) {
                googleEmail = result.user.email;
                googleName = result.user.displayName || googleEmail.split('@')[0];
            }
        } catch (firebaseErr) {
            console.warn("Firebase Google Auth notice:", firebaseErr);
            if (firebaseErr.code === "auth/unauthorized-domain" || firebaseErr.code === "auth/operation-not-allowed" || firebaseErr.code === "auth/auth-domain-config-required") {
                googleEmail = prompt("Note: Firebase Google Sign-In requires adding 'localhost' under Firebase Console > Auth > Authorized Domains.\n\nEnter your Google email to sign in locally:", "user@gmail.com");
                if (!googleEmail) return;
                googleName = googleEmail.split('@')[0];
            } else {
                alert("Google Sign-In Error: " + firebaseErr.message);
                return;
            }
        }

        if (!googleEmail) return;

        // Sync with backend API (Register if new, or Login if existing)
        const username = googleEmail.split('@')[0] + "_g";
        let token = null;

        try {
            const regRes = await fetch("/api/auth/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: username,
                    email: googleEmail,
                    password: "GoogleOAuthSecurePass2026!",
                    full_name: googleName || "Google Eco User"
                })
            });
            const regData = await regRes.json();
            if (regRes.ok && regData.token) {
                token = regData.token;
            }
        } catch (e) {
            console.log("Registration sync note:", e);
        }

        if (!token) {
            const loginRes = await fetch("/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    email: googleEmail,
                    password: "GoogleOAuthSecurePass2026!"
                })
            });
            const loginData = await loginRes.json();
            if (loginRes.ok && loginData.token) {
                token = loginData.token;
            }
        }

        if (token) {
            localStorage.setItem("ecotrack_token", token);
        }

        alert("Google Login successful!");
        window.location.href = "index.html";
    } catch (error) {
        console.error("Google sign-in failure:", error);
        alert("Google login error: " + error.message);
    }
});



const forgotPassword = document.getElementById("forgotPassword");

forgotPassword.addEventListener("click", async (event) => {

    event.preventDefault();

    // Get email from input
    const email = document.getElementById("email").value;

    // Check whether email was entered
    if (!email) {
        alert("Please enter your email first.");
        return;
    }

    try {

        // Send password reset email
        await sendPasswordResetEmail(auth, email);

        alert("Password reset email sent! Check your inbox.");

    } catch (error) {

        console.error(error);

        if (error.code === "auth/user-not-found") {
            alert("No account found with this email.");
        }
        else if (error.code === "auth/invalid-email") {
            alert("Please enter a valid email.");
        }
        else {
            alert("Error: " + error.message);
        }
    }
});
</script>
</body>
</html>
