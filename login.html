<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack Signup</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=home,login,nest_eco_leaf" />
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav>
        <div class="nav-con">
       <div class="logo"><img src="images/bucket.png" alt="">EcoTrack</div> 
       <div class="links">
        <div class="link">
            <a href="index.html"> <span class="material-symbols-outlined">home</span>Home</a>
            <a href="signup.html"><span class="material-symbols-outlined">login</span>Signup</a>
        </div>
       </div>
        </div>
    </nav>

  
<section id="sec">

    <div class="sign-container">

        <div class="sign-comp">
             <h2>Login Now <span class="material-symbols-outlined">nest_eco_leaf</span> </h2>
              <form action=""> 
           

             <label for="email">Enter Your Email</label>
             <input type="email" name="email">


             <label for="pass">Enter Password</label>
             <input type="password" name="pass">
             <p id="pyar">Forgot password? <a href=""> Click Here</a></p>

           <button>Submit</button>
           <p>or</p>
            
           <button type="button" id="googleSignIn" class="google-btn">
                Login with Google <i class="fa-brands fa-google"></i>
            </button>
             </form> 
              <p>Dont Have an account?<a href="signup.html"> Create it</a></p>
        </div>

    </div>
</section>
    


</body>
</html>
