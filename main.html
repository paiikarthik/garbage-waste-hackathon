<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
     <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=home,login" />
     <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>

nav {

    background-color: rgb(255, 255, 255);
    padding: 10px 20px;
}


body {
    margin: 0;
    min-height: 100vh;
    background:wheat;
}

.nav-con {
    display: flex;
    align-items: center;
    justify-content: space-between;

}
#sec {
    display: flex;
    justify-content: flex-end;
    padding: 150px 100px 0 0;
}
.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 25px;
    color: green;
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    font-weight: 400;
}

.logo img {
    width: 40px;
    height: auto;
}

.links {
    margin: 0;

}

.link {
    display: flex;
    align-items: center;
    gap: 20px;
}

.link a {
    text-decoration: none;
    color:green;
    display: flex;
    font-weight: 600;
    align-items: center;
    gap: 5px;
}

#side{
   
    width: 100%;
    padding: 20px 15px;
    gap: 15px;
}

#sidebar{
    display:flex;
    flex-direction: column;
    padding: 20px 15px;
    background:#102617;
    width: 150px;
    min-height: calc(100vh - 61px);
    height: 300px;
}

#side a{
    color: white;
    text-decoration: none;
    margin-bottom: 20px;
    padding: 10px;
    border-radius: 5px;
    font-weight: 600;
    align-items: center;
    gap: 10px;
    display: flex;
}

.sidebar-menu{
    display: flex;
    flex-direction: column;
   
}

.sidebar-bottom{
    margin-top: auto;
    display: flex;
    flex-direction: column;
    border-top: 1px solid rgba(255,255,255,0.2);
    padding-top: 15px;
}
#side a:hover { background-color: rgba(255, 255, 255, 0.2); }

.search-box{
    display: flex;
    align-items: center;
    width: 400px;
    background-color: #f3f7f3;
    border: 1px solid #d6e2d7;

    border-radius: 25px;
    padding: 8px 15px;
    gap: 80x;
}

.search-box input{
    width: 100%;
    border: 1px solid #fff;
    border-radius: 120px;
}

.search-box span{
    color: #4f6b55;
    font-size: 22px;
}

.modal{
    display:none ;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.5);

    justify-content: center;
    align-items: center;
}

.post-box{
    background: white;
    width: 450px;
    border-radius: 15px;
    padding: 25px;
}
.post-header{
    display: flex;
    justify-content: space-between;
    align-items: center;
}


.post-header h2{
    margin: 0;
    text-align: center;
    color: #102617;
}


#closeBtn{
    font-size: 30px;
    cursor: pointer;
}


#postText {
    width: 100%;
    height: 150px;
    margin-top: 20px;
    padding: 10px;
    box-sizing: border-box;
    resize: none;
}

#postImage {
    margin-top: 15px;
}

#postBtn {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: green;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

#postTitle{
    width: 100%;
    font-size: 28px;
    font-weight: bold;
    padding: 12px;
    margin-top: 20px;
    box-sizing: border-box;
    border: none;
    outline: none;
}
</style>
</head>
<body>
    <nav>
        <div class="nav-con">
       <div class="logo"><img src="images/bucket.png" alt="">EcoTrack</div> 

       <!---Search Bar-->

       <div class="search-box">
          <span class="material-symbols-outlined">search</span>
          <input type="text" placeholder="Search EcoTrack...">
       </div>

       <div class="links">
        <div class="link">
            <a href=""> <span class="material-symbols-outlined">home</span>Home</a>
            <a href="#" id="createBtn">
                <span class="material-symbols-outlined">add</span>Create
            </a>
            <a href=""><span class="material-symbols-outlined">notifications</span></a>
        </div>
       </div>
        </div>
    </nav>

    <section id="sidebar">
        <div id="side">
            <div class="sidebar-menu">

                <a href="#" class="menu-item active">
                    <span class="material-symbols-outlined">home</span>
                    <span>Home</span>
                </a>

                <a href="#" class="menu-item">
                    <span class="material-symbols-outlined">post_add</span>
                    <span>Posts</span>
                </a>

                <a href="#" class="menu-item">
                    <span class="material-symbols-outlined">groups</span>
                    <span>Groups</span>
                </a>

                <a href="#" class="menu-item">
                    <span class="material-symbols-outlined">person</span>
                    <span>You</span>
                </a>
            </div>

            <div class="sidebar-bottom">
                 <a href="#" class="menu-item">
                    <span class="material-symbols-outlined">settings</span>
                    <span>Settings</span>
                </a>

                <a href="#" class="menu-item">
                       <span class="material-symbols-outlined">logout</span>
                       <span>Logout</span>
                </a>
            </div>
        </div>   
    </section>

<div id="postModal" class="modal">
    <div class="post-box">
        <div class="post-header">
            <h2>Create Post</h2>
           
            <span id="closeBtn">&times;</span>
        </div>
         <input type="text"  id="postTitle" placeholder="Enter a Post Title">
        <textarea name=""  id="postText" placeholder="Create New POst"></textarea>     
        <input type="file" id="postImage" accept="image/*">
        <button id="postBtn">Post</button>
    </div>
</div>
</body>
a

<script>
    const createBtn=document.getElementById("createBtn");
    const postModal=document.getElementById("postModal");
    const closeBtn=document.getElementById("closeBtn");

    createBtn.addEventListener("click",function(){
        event.preventDefault();

        postModal.style.display="flex";
    });

    closeBtn.addEventListener("click",function(){
        postModal.style.display="none";
    });

    postModal.addEventListener("click",function(event){
        if(event.target==postModal){
            postModal.style.display="none";
        }
    });
</script>
</html>
