<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack Signup</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=home,login" />
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav>
        <div class="nav-con">
       <div class="logo"><img src="images/bucket.png" alt="">EcoTrack</div> 
       <div class="links">
        <div class="link">
            <a href=""> <span class="material-symbols-outlined">home</span>Home</a>
            <a href="login.html"><span class="material-symbols-outlined">login</span>Login</a>
        </div>
       </div>
        </div>
    </nav>

  
<section id="sec">

    <div class="sign-container">

        <div class="sign-comp">
             <h2>Create Account</h2>
              <form action="" id="signupForm"> 
             <label for="name">Enter Your Name</label>
             <input type="text" name="name"> 

             <label for="email">Enter Your Email</label>
             <input type="email" name="email">


             <label for="pass">Enter Password</label>
             <input type="password" name="pass">

           <button>Submit</button>
           <p>or</p>
            
           <button type="button" id="googleSignIn" class="google-btn">
                Login with Google <i class="fa-brands fa-google"></i>
            </button>
             </form> 
              <p>Already Have a Account? <a href="login.html"> Login</a></p>
        </div>

    </div>
</section>
<script type="module">
// Import the functions you need from the SDKs you need
     import {
        getAuth,
        createUserWithEmailAndPassword,
        GoogleAuthProvider,
        signInWithPopup,
        updateProfile
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


//connecting website with firebase
 import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
// TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyBl3f2IdW8reYSagNrftzXajeq-CTJHYTY",
    authDomain: "ecotrack-cd381.firebaseapp.com",
    projectId: "ecotrack-cd381",
    storageBucket: "ecotrack-cd381.firebasestorage.app",
    messagingSenderId: "259113016797",
    appId: "1:259113016797:web:f1e681e829f873fff3ea34"
  };

  // Initialize Firebase using above info
  const app = initializeApp(firebaseConfig);


  const auth=getAuth(app);


  const signupForm=document.getElementById("signupForm");

  signupForm.addEventListener("submit", async(event)=>{

        // Prevent page from refreshing when submitting
        event.preventDefault();

        const name = document.getElementById("name").value;

        const email = document.getElementById("email").value;

        const password = document.getElementById("pass").value;

           try {

            // Create Firebase account
            const userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            // Get the newly created user
            const user = userCredential.user;


            // Add user's name to Firebase profile
            await updateProfile(user, {
                displayName: name
            });


            console.log("Account created:", user);

            alert("Account created successfully!");


            // Redirect to home page
            window.location.href = "index.html";


        } catch (error) {

            console.error(error);

            alert(error.message);

        }

    });


    // 8. Google Sign In
  

    const googleButton =
        document.getElementById("googleSignIn");


    googleButton.addEventListener("click", async () => {

        try {

            // Create Google provider
            const provider = new GoogleAuthProvider();


            // Open Google login popup
            const result =
                await signInWithPopup(auth, provider);


            // Get logged-in user
            const user = result.user;


            console.log("Google user:", user);

            alert("Google login successful!");


            // Redirect
            window.location.href = "index.html";


        } catch (error) {

            console.error(error);

            alert(error.message);

        }

  });

</script>    
</body>
</html>
