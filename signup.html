<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack Signup</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=home,login" />
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav>
        <div class="nav-con">
       <div class="logo"><img src="images/bucket.png" alt="">EcoTrack</div> 
       <div class="links">
        <div class="link">
            <a href=""> <span class="material-symbols-outlined">home</span>Home</a>
            <a href="login.html"><span class="material-symbols-outlined">login</span>Login</a>
        </div>
       </div>
        </div>
    </nav>

  
<section id="sec">

    <div class="sign-container">

        <div class="sign-comp">
             <h2>Create Account</h2>
              <form action="" id="signupForm"> 
             <label for="name">Enter Your Name</label>
             <input type="text" name="name" id="name" required> 

             <label for="email">Enter Your Email</label>
             <input type="email" name="email" id="email" required>


             <label for="pass">Enter Password</label>
             <input type="password" name="pass" id="pass" required>

           <button>Submit</button>
           <p>or</p>
            
           <button type="button" id="googleSignIn" class="google-btn">
                Login with Google <i class="fa-brands fa-google"></i>
            </button>
             </form> 
              <p>Already Have a Account? <a href="login.html"> Login</a></p>
        </div>

    </div>
</section>
<script type="module">
// Import the functions you need from the SDKs you need
     import {
        getAuth,
        createUserWithEmailAndPassword,
        GoogleAuthProvider,
        signInWithPopup,
        updateProfile
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


//connecting website with firebase
 import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBl3f2IdW8reYSagNrftzXajeq-CTJHYTY",
    authDomain: "ecotrack-cd381.firebaseapp.com",
    projectId: "ecotrack-cd381",
    storageBucket: "ecotrack-cd381.firebasestorage.app",
    messagingSenderId: "259113016797",
    appId: "1:259113016797:web:f1e681e829f873fff3ea34"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const signupForm = document.getElementById("signupForm");

  signupForm.addEventListener("submit", async(event)=>{
        event.preventDefault();

        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("pass").value;
        const username = email.split('@')[0] + "_" + Math.floor(Math.random() * 1000);

        try {
            // Register in local backend API
            const apiRes = await fetch("/api/auth/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: username,
                    email: email,
                    password: password,
                    full_name: name
                })
            });

            if (apiRes.ok) {
                const data = await apiRes.json();
                localStorage.setItem("ecotrack_token", data.token);
            }

            // Also register in Firebase if available
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(userCredential.user, { displayName: name });
            } catch (e) {
                console.log("Firebase sync note:", e.message);
            }

            alert("Account created successfully!");
            window.location.href = "index.html";
        } catch (error) {
            console.error(error);
            alert(error.message);
        }
    });


    // 8. Google Sign In
  

    const googleButton = document.getElementById("googleSignIn");

    googleButton.addEventListener("click", async () => {
        const provider = new GoogleAuthProvider();
        try {
            let googleEmail = null;
            let googleName = null;
            let googlePic = null;

            try {
                const result = await signInWithPopup(auth, provider);
                if (result && result.user) {
                    googleEmail = result.user.email;
                    googleName = result.user.displayName;
                    googlePic = result.user.photoURL;
                }
            } catch (firebaseErr) {
                console.warn("Firebase Google Auth notice:", firebaseErr);
                if (firebaseErr.code === "auth/unauthorized-domain" || firebaseErr.code === "auth/operation-not-allowed" || firebaseErr.code === "auth/auth-domain-config-required") {
                    googleEmail = prompt("Note: Firebase Google Sign-In requires adding 'localhost' under Firebase Console > Auth > Authorized Domains.\n\nEnter your Google email to sign in locally:", "karthik@gmail.com");
                    if (!googleEmail) return;
                    googleName = prompt("Enter your full name:", "Karthik Pai");
                } else {
                    alert("Google Sign-In Error: " + firebaseErr.message);
                    return;
                }
            }

            if (!googleEmail) return;

            // Call backend Google Auth API
            const apiRes = await fetch("/api/auth/google", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    email: googleEmail,
                    full_name: googleName,
                    profile_pic: googlePic
                })
            });
            const data = await apiRes.json();
            if (!apiRes.ok) {
                alert(data.detail || data.message || "Google Login failed.");
                return;
            }

            if (data.token) {
                localStorage.setItem("ecotrack_token", data.token);
            }

            alert("Welcome, " + (data.user ? data.user.full_name : "EcoTrack User") + "!");
            window.location.href = "index.html";
        } catch (error) {
            console.error("Google sign-in failure:", error);
            alert("Google login error: " + error.message);
        }
    });

</script>    
</body>
</html>
