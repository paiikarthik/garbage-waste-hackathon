<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack Signup</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=home,login" />

</head>
<body>
    <nav>
        <div class="nav-con">
       <div class="logo">EcoTrack</div> 
       <div class="links">
        <div class="link">
            <a href=""> <span class="material-symbols-outlined">home</span>Home</a>
            <a href=""><span class="material-symbols-outlined">login</span>Login</a>
        </div>
       </div>
        </div>
    </nav>

  
<section id="sec">

    <div class="sign-container">

        <div class="sign-comp">
             <h2>Login Now</h2>
              <form action=""> 
             <label for="name">Enter Your Name</label>
             <input type="text" name="name"> 

             <label for="email">Enter Your Email</label>
             <input type="email" name="email">


             <label for="pass">Enter Password</label>
             <input type="password" name="pass">

           <button>Submit</button>
             </form> 
        </div>

    </div>
</section>
    


</body>
</html>
